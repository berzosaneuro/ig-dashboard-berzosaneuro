<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#000000; --surface:#0F0F0F; --surface2:#080808; --border:rgba(255,255,255,0.07);
    --text:#F1F5F9; --text2:#94A3B8; --muted:#64748B;
    --blue:#0066FF; --blue-hover:#3385FF; --cyan:#06B6D4; --teal:#14B8A6;
    --amber:#F59E0B; --emerald:#10B981; --rose:#F43F5E; --purple:#5B21B6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;}
  h1,h2,h3,h4{font-family:Poppins,Inter,system-ui,sans-serif;margin:0;}
  a{color:var(--blue);text-decoration:none;}
  a:hover{color:var(--blue-hover);}
  .app{max-width:1280px;margin:0 auto;padding:0 20px 80px;}
  header.top{position:sticky;top:0;z-index:20;background:rgba(0,0,0,0.9);backdrop-filter:blur(20px) saturate(160%);border-bottom:1px solid var(--border);padding:18px 20px;}
  header.top .inner{max-width:1280px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;flex-direction:column;gap:2px;}
  .brand h1{font-size:19px;font-weight:700;}
  .brand h1 span{color:var(--blue);}
  .brand p{font-size:12px;color:var(--text2);margin:0;}
  .badges{display:flex;gap:8px;flex-wrap:wrap;}
  .badge{font-size:11px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--text2);}
  .badge.ig{color:#E1306C;background:rgba(225,48,108,0.1);border-color:rgba(225,48,108,0.25);}
  .badge.fb{color:#1877F2;background:rgba(24,119,242,0.1);border-color:rgba(24,119,242,0.25);}
  nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 0;margin-bottom:10px;-webkit-overflow-scrolling:touch;}
  nav.tabs::-webkit-scrollbar{display:none;}
  .tab-btn{flex:0 0 auto;font-size:12.5px;font-weight:500;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:rgba(255,255,255,0.03);color:var(--text2);cursor:pointer;white-space:nowrap;transition:.15s;}
  .tab-btn:hover{background:rgba(255,255,255,0.06);color:var(--text);}
  .tab-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  section.tab{display:none;padding-top:18px;}
  section.tab.active{display:block;}
  .grid{display:grid;gap:14px;}
  .grid.cols-4{grid-template-columns:repeat(4,1fr);}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  .grid.cols-2{grid-template-columns:repeat(2,1fr);}
  @media(max-width:900px){.grid.cols-4{grid-template-columns:repeat(2,1fr);} .grid.cols-3{grid-template-columns:repeat(2,1fr);} .grid.cols-2{grid-template-columns:1fr;}}
  @media(max-width:560px){.grid.cols-4{grid-template-columns:1fr 1fr;}}
  .card{background:rgba(8,8,8,0.75);backdrop-filter:blur(20px) saturate(160%);border:1px solid var(--border);border-radius:16px;padding:18px;}
  .card.pad-sm{padding:14px;}
  .metric .label{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px;}
  .metric .value{font-size:26px;font-weight:700;}
  .metric .sub{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .metric .trend{font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;display:inline-block;margin-top:6px;}
  .trend.up{color:var(--emerald);background:rgba(16,185,129,.12);}
  .trend.down{color:var(--rose);background:rgba(244,63,94,.12);}
  .trend.flat{color:var(--text2);background:rgba(255,255,255,.05);}
  h2.section-title{font-size:18px;font-weight:700;margin-bottom:4px;}
  p.section-sub{font-size:13px;color:var(--text2);margin:0 0 16px;line-height:1.5;}
  .note{font-size:12.5px;color:var(--muted);background:rgba(255,255,255,0.03);border:1px dashed var(--border);border-radius:10px;padding:10px 12px;margin:10px 0;line-height:1.5;}
  .note.warn{color:var(--amber);border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.06);}
  .note.na{color:var(--rose);border-color:rgba(244,63,94,.25);background:rgba(244,63,94,.05);}
  .note.insight{color:var(--cyan);border-color:rgba(6,182,212,.3);background:rgba(6,182,212,.06);}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text2);padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;}
  th:hover{color:var(--text);}
  td{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,0.04);vertical-align:middle;white-space:nowrap;}
  tr:hover td{background:rgba(255,255,255,0.02);}
  .table-wrap{overflow-x:auto;border-radius:12px;}
  .pill{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:999px;}
  .pill.reel{background:rgba(6,182,212,.12);color:var(--cyan);}
  .pill.carousel{background:rgba(91,33,182,.15);color:#a78bfa;}
  .score{font-weight:700;}
  .score.hi{color:var(--emerald);}
  .score.mid{color:var(--amber);}
  .score.lo{color:var(--rose);}
  .chart-box{position:relative;height:280px;}
  .chart-box.tall{height:340px;}
  ul.clean{margin:0;padding-left:18px;font-size:13.5px;line-height:1.7;color:var(--text);}
  ul.clean li{margin-bottom:4px;}
  .flow{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin-top:10px;}
  .flow-step{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:14px 18px;min-width:120px;text-align:center;}
  .flow-step .n{font-size:20px;font-weight:700;}
  .flow-step .l{font-size:11px;color:var(--text2);margin-top:3px;}
  .flow-arrow{color:var(--muted);font-size:18px;padding:0 8px;}
  .rec{border-left:3px solid var(--blue);background:rgba(255,255,255,.02);border-radius:0 10px 10px 0;padding:12px 14px;margin-bottom:10px;}
  .rec .k{font-size:13px;font-weight:600;margin-bottom:4px;}
  .rec .row{font-size:12px;color:var(--text2);margin-top:4px;}
  .rec .row b{color:var(--text);font-weight:500;}
  .tag-prio{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;}
  .tag-prio.alta{background:rgba(244,63,94,.15);color:var(--rose);}
  .tag-prio.media{background:rgba(245,158,11,.15);color:var(--amber);}
  .tag-prio.baja{background:rgba(255,255,255,.06);color:var(--text2);}
  .conf{font-size:10px;color:var(--text2);}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media(max-width:800px){.two-col{grid-template-columns:1fr;}}
  .idea-card{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
  .idea-card .tag{font-size:10px;color:var(--cyan);text-transform:uppercase;font-weight:700;letter-spacing:.03em;}
  .idea-card h4{font-size:13.5px;margin:5px 0 6px;}
  .idea-card p{font-size:12px;color:var(--text2);margin:0 0 6px;line-height:1.5;}
  .cal-day{background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:12.5px;}
  .cal-day .d{font-weight:700;color:var(--blue-hover);font-size:11px;}
  footer.foot{text-align:center;font-size:11px;color:var(--muted);padding:30px 0 10px;}
  .kpi-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .platform-compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;}
  .platform-col{text-align:center;}
  .platform-col .big{font-size:28px;font-weight:800;}
  .platform-col.ig .big{color:#E1306C;}
  .platform-col.fb .big{color:#1877F2;}
  .vs{color:var(--muted);font-size:12px;font-weight:700;}
</style>
</head>
<body>
<div id="root"></div>
<script src="bootstrap.js"></script>
</body>
